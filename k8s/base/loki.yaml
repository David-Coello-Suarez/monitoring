apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mon-loki
  namespace: monitoreo
spec:
  serviceName: mon-loki
  replicas: 1
  selector:
    matchLabels:
      app: mon-loki
  template:
    metadata:
      labels:
        app: mon-loki
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: docker.io/grafana/loki@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
          args:
            - -config.file=/etc/loki/loki.yml
          readinessProbe:
            httpGet: {host: 127.0.0.1, port: 3100, path: /ready}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: datos
              mountPath: /loki
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/loki/loki.yml
              subPath: loki.yml
            - name: reglas
              mountPath: /etc/loki/reglas/fake
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: loki-config
        - name: reglas
          configMap:
            name: loki-reglas
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

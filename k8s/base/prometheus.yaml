apiVersion: v1
kind: ServiceAccount
metadata:
  name: mon-prometheus
  namespace: monitoreo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: monitoreo-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: monitoreo-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: monitoreo-prometheus
subjects:
  - kind: ServiceAccount
    name: mon-prometheus
    namespace: monitoreo
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mon-prometheus
  namespace: monitoreo
spec:
  serviceName: mon-prometheus
  replicas: 1
  selector:
    matchLabels:
      app: mon-prometheus
  template:
    metadata:
      labels:
        app: mon-prometheus
    spec:
      serviceAccountName: mon-prometheus
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=30d
            - --web.listen-address=127.0.0.1:9091
            - --web.enable-lifecycle
          readinessProbe:
            httpGet: {host: 127.0.0.1, port: 9091, path: /-/ready}
            periodSeconds: 15
          livenessProbe:
            httpGet: {host: 127.0.0.1, port: 9091, path: /-/healthy}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: datos
              mountPath: /prometheus
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: reglas
              mountPath: /etc/prometheus/reglas
            - name: objetivos
              mountPath: /etc/prometheus/objetivos
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: reglas
          configMap:
            name: prometheus-reglas
        - name: objetivos
          configMap:
            name: prometheus-objetivos
  volumeClaimTemplates:
    - metadata:
        name: datos
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi

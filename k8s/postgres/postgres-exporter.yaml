apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-postgres-exporter
  namespace: monitoreo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mon-postgres-exporter
  template:
    metadata:
      labels:
        app: mon-postgres-exporter
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-exporter
          image: docker.io/prometheuscommunity/postgres-exporter@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
          args:
            - --web.listen-address=127.0.0.1:9187
          envFrom:
            - configMapRef:
                name: postgres-exporter-env
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: secretos
              mountPath: /run/secrets
              readOnly: true
      volumes:
        - name: secretos
          secret:
            secretName: pg-password
            defaultMode: 0440

global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    servidor: __SERVIDOR__

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["127.0.0.1:9093"]

rule_files:
  - /etc/prometheus/reglas/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9091"]

  - job_name: node
    static_configs:
      - targets: ["127.0.0.1:9100"]

  - job_name: podman
    static_configs:
      - targets: ["127.0.0.1:9882"]

  - job_name: cloudflared
    static_configs:
      - targets: ["127.0.0.1:__CLOUDFLARED_PUERTO__"]

  - job_name: postgres
    file_sd_configs:
      - files: ["/etc/prometheus/objetivos/postgres.yml"]

  - job_name: alertmanager
    static_configs:
      - targets: ["127.0.0.1:9093"]

  - job_name: loki
    static_configs:
      - targets: ["127.0.0.1:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["127.0.0.1:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["127.0.0.1:3000"]

  - job_name: blackbox
    static_configs:
      - targets: ["127.0.0.1:9115"]

  - job_name: apps
    metrics_path: /probe
    params:
      module: [http_app]
    file_sd_configs:
      - files: ["/etc/prometheus/objetivos/apps.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: red
    metrics_path: /probe
    params:
      module: [icmp]
    file_sd_configs:
      - files: ["/etc/prometheus/objetivos/red.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

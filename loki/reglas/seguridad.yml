        annotations:
          summary: "minga: posible escaneo de rutas desde {{ $labels.ip }}: más de 10 rutas sospechosas en 5 min"
      - alert: WebRafagaErrores
        expr: |
          sum by (ip) (count_over_time({contenedor="minga-frontend"} | pattern `<ip> - [<_>] "<metodo> <ruta> <_>" <estado> <_> "<_>" "<ua>" <_>` | ip != "" | ip != "-" | ip !~ `10\..*` | ip !~ `127\..*` | ip != "::1" | ua !~ `Blackbox.*` | estado=~`4..` [5m])) > 100
        labels:

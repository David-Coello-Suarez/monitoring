      - alert: WebRafagaPeticiones
        expr: |
          sum by (ip) (count_over_time({contenedor="minga-frontend"} | pattern `<ip> - [<_>] "<metodo> <ruta> <_>" <estado> <_> "<_>" "<ua>" <_>` | ip != "" | ip != "-" | ip !~ `10\..*` | ip !~ `127\..*` | ip != "::1" | ua !~ `Blackbox.*` [5m])) > 3000
        labels:
          severity: warning
          app: minga
        annotations:
          summary: "minga: más de 3000 peticiones en 5 min desde {{ $labels.ip }}"
      - alert: WebFuerzaBrutaLogin
        expr: |
          sum by (ip) (count_over_time({contenedor="solarlink-frontend"} | pattern `<_> - - [<_>] "<metodo> <ruta> <_>" <estado> <_> "<_>" "<ua>" "<ip>"` | ip != "" | ip != "-" | ip !~ `10\..*` | ip !~ `127\..*` | ip != "::1" | ua !~ `Blackbox.*` | metodo="POST" | ruta=~`(?i).*/(login|signin|auth/token|sessions?)(/.*|\?.*)?` | estado=~`401|429` [5m])) > 10
        labels:
